<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sarah and Mo</title>
<!-- "Sarah and Mo": the 96-second story film. window.render(t) draws the frame at t seconds.
     Sarah's life → her Monday grind → Mo → into her screen → teach once → Mo takes over
     (with edge cases) → back out → Mubit → end. render.js captures it; voice.js adds sound. -->
<style>
  :root { --paper: #fbfaf7; --ink: #16181d; --slate: #646a76; --rule: #e6e4df; --ember: #f05a1e; --ember-soft: #fff0e8; --night: #0f1013; --amber: #b7791f; --teal: #2f6f73; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper);
    font-family: -apple-system, "SF Pro Display", "Inter", system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .abs { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; }
  .layer { position: absolute; inset: 0; overflow: hidden; }
  .card { background: #fff; border: 1px solid var(--rule); border-radius: 22px; box-shadow: 0 24px 60px rgba(22, 24, 29, .08), 0 2px 6px rgba(22, 24, 29, .04); }
  /* subtitles and labels */
  #subs { position: absolute; left: 0; right: 0; bottom: 54px; text-align: center; }
  #subs span { display: inline-block; padding: 10px 22px; border-radius: 14px; background: rgba(16, 17, 20, .72); color: #fff; font-size: 34px; font-weight: 550; letter-spacing: -0.01em; }
  .lower { position: absolute; padding: 16px 24px; border-radius: 16px; background: rgba(255, 255, 255, .94); box-shadow: 0 14px 40px rgba(0, 0, 0, .12); }
  .lower b { display: block; font-size: 34px; letter-spacing: -0.02em; } .lower span { font-size: 22px; color: var(--slate); }
  .lower::before { content: ''; position: absolute; left: 0; top: 14px; bottom: 14px; width: 6px; border-radius: 3px; background: var(--teal); }
  .daytag { position: absolute; padding: 10px 20px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 26px; font-weight: 650; }
  .tagline { position: absolute; padding: 14px 24px; border-radius: 18px; background: #fff; box-shadow: 0 14px 40px rgba(0, 0, 0, .14); font-size: 30px; font-weight: 650; white-space: nowrap; }
  .tagline em { font-style: normal; color: var(--ember); }
  /* app UI (inside the screen) */
  .form .brand { position: absolute; left: 30px; top: 22px; font-size: 18px; font-weight: 700; color: #0e7c66; }
  .form .title { position: absolute; left: 30px; top: 50px; font-size: 32px; font-weight: 700; letter-spacing: -0.02em; }
  .form .lab { position: absolute; left: 30px; font-size: 18px; font-weight: 600; color: var(--slate); }
  .form .inp { position: absolute; left: 30px; height: 46px; border: 1.5px solid var(--rule); border-radius: 11px; background: #fff; font-size: 21px; line-height: 46px; padding: 0 14px; box-sizing: border-box; overflow: hidden; white-space: nowrap; }
  .form .inp.focus { border-color: var(--ember); box-shadow: 0 0 0 4px rgba(240, 90, 30, .14); }
  .form .inp.bad { border-color: #c2410c; background: #fff7ed; }
  .form .inp .caret { display: inline-block; width: 2px; height: 24px; background: var(--ink); vertical-align: -4px; margin-left: 1px; }
  .form .btn { position: absolute; left: 30px; height: 50px; padding: 0 30px; border-radius: 12px; background: #0e7c66; color: #fff; font-size: 20px; font-weight: 650; line-height: 50px; }
  .form .err { position: absolute; left: 240px; font-size: 18px; font-weight: 600; color: #c2410c; }
  .form .sel::after { content: '▾'; position: absolute; right: 14px; color: var(--slate); font-size: 16px; }
  .sheet .bar { position: absolute; left: 24px; top: 18px; display: flex; gap: 12px; align-items: center; font-size: 22px; font-weight: 600; }
  .sheet .logo { width: 22px; height: 28px; border-radius: 4px; background: #188038; }
  .sheet .rows { position: absolute; left: 24px; overflow: hidden; }
  .sheet .cell { position: absolute; font-size: 18px; line-height: 46px; padding: 0 10px; box-sizing: border-box; white-space: nowrap; overflow: hidden; border-right: 1px solid #ecebe7; border-bottom: 1px solid #ecebe7; background: #fff; }
  .sheet .head { background: #f4f3f0; font-weight: 650; color: #3c4048; }
  .sheet .num { color: #9a9ea7; text-align: center; padding: 0; background: #f8f7f4; }
  .sheet .foot { position: absolute; left: 24px; font-size: 18px; color: var(--slate); }
  .rowhl { position: absolute; background: rgba(240, 90, 30, .1); border: 2px solid rgba(240, 90, 30, .55); border-radius: 6px; box-sizing: border-box; }
  .pill { position: absolute; padding: 10px 18px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 21px; font-weight: 600; white-space: nowrap; box-shadow: 0 10px 26px rgba(0, 0, 0, .18); }
  .tag { position: absolute; padding: 9px 15px; border-radius: 12px; background: var(--ember-soft); border: 1.5px solid var(--ember); color: #b13a0b; font-size: 20px; font-weight: 650; white-space: nowrap; box-shadow: 0 8px 22px rgba(240, 90, 30, .18); }
  .tag.warn { background: #fff7ed; border-color: #c2410c; color: #9a3412; }
  .note { position: absolute; padding: 14px 18px; border-radius: 16px; background: var(--ember-soft); border: 2px solid var(--ember); color: #8f2d06; font-size: 21px; font-weight: 600; width: 430px; box-shadow: 0 14px 34px rgba(240, 90, 30, .2); }
  .note b { color: var(--ember); }
  .stamp { position: absolute; padding: 10px 22px; border: 4px solid var(--ember); border-radius: 14px; color: var(--ember); font-size: 32px; font-weight: 800; background: rgba(255, 255, 255, .92); }
  .panel { position: absolute; width: 420px; border-radius: 20px; background: #fff; border: 1px solid var(--rule); box-shadow: 0 24px 60px rgba(22, 24, 29, .14); padding: 20px 22px; box-sizing: border-box; }
  .panel h4 { margin: 0 0 6px; font-size: 22px; } .panel p { margin: 0; font-size: 18px; color: var(--slate); }
  .rule { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--rule); font-size: 18px; }
  .rule b { font-weight: 650; } .rule span { color: var(--slate); text-align: right; } .rule .hl { color: var(--ember); font-weight: 650; }
  .summary { position: absolute; padding: 16px 24px; border-radius: 16px; background: var(--ink); color: #fff; font-size: 28px; font-weight: 650; white-space: nowrap; box-shadow: 0 18px 44px rgba(0, 0, 0, .25); }
  .summary .ok { color: #7ee2b8; } .summary .look { color: #fbbf77; } .summary .retry { margin-left: 18px; padding: 6px 14px; border-radius: 10px; background: #fff; color: var(--ink); font-size: 22px; }
  .skill { position: absolute; width: 440px; height: 104px; border-radius: 18px; background: #fff; border: 1px solid var(--rule); box-shadow: 0 14px 34px rgba(22, 24, 29, .08); overflow: hidden; }
  .skill::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 7px; background: var(--ember); }
  .skill .n { position: absolute; left: 28px; top: 20px; font-size: 25px; font-weight: 700; } .skill .m { position: absolute; left: 28px; top: 60px; font-size: 18px; color: var(--slate); }
  .counter { position: absolute; font-size: 26px; font-weight: 650; color: var(--slate); white-space: nowrap; }
  .counter b { color: var(--ink); font-size: 34px; }
  /* Mubit and chart */
  .node { position: absolute; border-radius: 50%; display: grid; place-items: center; }
  .node-label { position: absolute; font-size: 24px; font-weight: 650; white-space: nowrap; transform: translateX(-50%); }
  .node-sub { position: absolute; font-size: 18px; color: var(--slate); white-space: nowrap; transform: translateX(-50%); }
  .dot { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--ember); box-shadow: 0 0 12px rgba(240, 90, 30, .6); }
  .chart-title { position: absolute; font-size: 26px; font-weight: 700; } .chart-sub { position: absolute; font-size: 18px; color: var(--slate); }
  .est { position: absolute; padding: 4px 10px; border-radius: 8px; background: #f1efe9; color: var(--slate); font-size: 16px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; }
  .wordmark { position: absolute; left: 0; width: 1920px; text-align: center; font-weight: 800; letter-spacing: -0.05em; font-size: 170px; }
  .endline { position: absolute; left: 0; width: 1920px; text-align: center; font-size: 54px; font-weight: 600; color: var(--slate); letter-spacing: -0.02em; }
  .footer { position: absolute; left: 0; width: 1920px; text-align: center; font-size: 24px; color: var(--slate); } .footer b { color: var(--ink); }
  .bubble { position: absolute; padding: 16px 22px; border-radius: 22px; background: #fff; box-shadow: 0 14px 40px rgba(0, 0, 0, .14); font-size: 26px; font-weight: 600; max-width: 520px; }
  svg { overflow: visible; }
</style>
</head>
<body>
<div id="stage">
  <div id="life" class="layer"></div>
  <div id="worldLayer" class="layer"><div id="world" class="abs" style="width:1920px;height:1080px;transform-origin:0 0"></div></div>
  <div id="explain" class="layer"></div>
  <div id="mubit" class="layer"></div>
  <div id="end" class="layer"></div>
  <div id="overlay" class="layer"></div>
  <div id="subs"><span></span></div>
  <div id="fade" class="layer" style="background:#000;pointer-events:none"></div>
</div>
<script src="sarah.js"></script>
<script>
// ---- Motion helpers (one spring for everything) ---------------------------------------------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, start, dur) => clamp((t - start) / dur);
const lerp = (a, b, x) => a + (b - a) * x;
const easeOut = p => 1 - (1 - p) ** 3;
const easeInOut = p => (p < 0.5 ? 4 * p ** 3 : 1 - (-2 * p + 2) ** 3 / 2);
const spring = p => (p <= 0 ? 0 : p >= 1 ? 1 : 1 - Math.exp(-6 * p) * Math.cos(8.6 * p));
const typed = (s, p) => s.slice(0, Math.round(s.length * clamp(p)));
const blinkAt = (t, at, dur = 0.16) => { const p = prog(t, at, dur); return p <= 0 || p >= 1 ? 0 : Math.sin(Math.PI * p); };
const $ = id => document.getElementById(id);
function el(parent, cls, html = '', style = '') { const e = document.createElement('div'); e.className = `abs ${cls}`; e.innerHTML = html; if (style) e.style.cssText += style; parent.appendChild(e); return e; }
function put(e, { x = 0, y = 0, s = 1, r = 0, o = 1, sx = 1, sy = 1 } = {}) {
  e.style.transform = `translate(${x}px, ${y}px) rotate(${r}deg) scale(${s * sx}, ${s * sy})`;
  e.style.opacity = o; e.style.visibility = o <= 0.001 ? 'hidden' : 'visible';
}
const show = (layer, on) => { layer.style.display = on ? 'block' : 'none'; };
const CUES = [];
const cue = (t, sound, v = 1) => CUES.push({ t: +t.toFixed(3), sound, v });
const filmCue = (t, sound, v = 1) => CUES.push({ t: +t.toFixed(3), sound, v, film: true }); // already in film time
const NS = 'http://www.w3.org/2000/svg';

// ---- Mo (a factory: one on Sarah's screen, one on the end card) --------------------------
function makeMo(parent, size = 200) {
  const w = el(parent, '', `<svg viewBox="0 0 64 64" width="200" height="200"><defs><radialGradient id="g${parent.id || Math.random().toString(36).slice(2)}" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffb894"/><stop offset=".55" stop-color="#ff6a2b"/><stop offset="1" stop-color="#e0440e"/></radialGradient></defs>
    <ellipse data-m="shadow" cx="32" cy="61" rx="15" ry="2.6" fill="rgba(0,0,0,.16)"/><circle cx="32" cy="31" r="24" fill="#ff6a2b"/><circle cx="32" cy="31" r="24" data-m="body"/>
    <ellipse cx="23" cy="19" rx="6" ry="4" fill="#fff" opacity=".35"/>
    <ellipse data-m="el" cx="24" cy="31" rx="4.4" ry="5.4" fill="#fff"/><ellipse data-m="er" cx="40" cy="31" rx="4.4" ry="5.4" fill="#fff"/>
    <circle data-m="pl" cx="25" cy="32" r="2.5" fill="#1d1d1f"/><circle data-m="pr" cx="41" cy="32" r="2.5" fill="#1d1d1f"/>
    <path data-m="mouth" d="M27 41 Q32 45 37 41" stroke="#7a2306" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>`, 'width:200px;height:200px;transform-origin:50% 92%');
  const g = w.querySelector('radialGradient').id;
  w.querySelector('[data-m="body"]').setAttribute('fill', `url(#${g})`);
  const m = k => w.querySelector(`[data-m="${k}"]`);
  return function set({ x = 0, y = 0, size: sz = size, look = [0, 0], blink = 0, squash = 0, happy = 0, o = 1, wave = 0 }) {
    const s = sz / 200, sx = 1 + squash * 0.35, sy = 1 - squash * 0.35;
    put(w, { x: x - 100, y: y - 100, s, sx, sy, o, r: Math.sin(wave * Math.PI * 4) * 8 * (wave > 0 && wave < 1 ? 1 : 0) });
    const lx = clamp(look[0], -1, 1) * 2.4, ly = clamp(look[1], -1, 1) * 2.2, open = 1 - clamp(Math.max(blink, happy * 0.55));
    [['l', 24], ['r', 40]].forEach(([k, cx]) => {
      m(`e${k}`).setAttribute('ry', (5.4 * Math.max(0.08, open)).toFixed(2)); m(`e${k}`).setAttribute('cx', cx + lx * 0.4); m(`e${k}`).setAttribute('cy', 31 + ly * 0.3 - happy);
      m(`p${k}`).setAttribute('cx', cx + 1 + lx); m(`p${k}`).setAttribute('cy', 32 + ly - happy); m(`p${k}`).setAttribute('r', (2.5 * Math.max(0.05, open)).toFixed(2));
    });
    m('mouth').setAttribute('d', `M27 41 Q32 ${45 + happy * 2} 37 41`);
  };
}

// ---- Subtitles: the narration, on screen for sound-off viewers ----------------------------
// Times are in the film's final timeline (after the explainer scene was added at 23 s).
const VO = [
  [0.7, 'This is Sarah.'],
  [5.9, 'Her job is looking after the company\'s new customers.'],
  [10.9, 'Helping people is the part of the job she loves.'],
  [17.2, 'But every Monday, the sales team emails her a spreadsheet: every customer who signed up last week.'],
  [23.4, 'Each one has to be typed into the support system by hand, so the team can help them.'],
  [29.4, 'Forty-seven customers. Copy, paste, check, save. Over and over.'],
  [34.2, 'And some rows are messy, so she has to stop and check.'],
  [40.4, 'Then she tried Mo: an assistant in her browser that she can teach by showing it once.'],
  [48.4, 'She fills in the first customer herself while Mo watches. Where the spreadsheet doesn\'t have the answer, she adds a note.'],
  [57.6, 'Mo saves it as a skill: a task it now knows how to do.'],
  [61.4, 'Then Mo does the other forty-six.'],
  [64.0, '"Ent"? Mo knows that means Enterprise.'],
  [66.7, 'No owner? It follows her note.'],
  [69.1, 'And when an email address is broken, Mo doesn\'t guess. It asks Sarah to check.'],
  [76.6, 'All forty-seven, done before her coffee\'s gone cold.'],
  [80.4, 'And she\'s back to the part of the job she loves.'],
  [83.8, 'Behind the scenes, every step Mo takes goes through Mubit.'],
  [87.4, 'Mubit learns from Sarah\'s lessons, and trains a smaller, cheaper AI to do the same task.'],
  [92.6, 'So her Monday task gets faster, and cheaper, every week.'],
  [99.4, 'Mo. Show it once.'],
];
function subtitles(t) {
  const i = VO.findIndex(([a], k) => t >= a - 0.1 && t < Math.min((VO[k + 1]?.[0] ?? 106) - 0.15, a + 7.5));
  const span = $('subs').firstChild;
  if (i < 0 || (t >= 97.6 && t < 99.2)) { span.style.opacity = 0; return; }
  const [a] = VO[i];
  const until = Math.min((VO[i + 1]?.[0] ?? 106) - 0.15, a + 7.5);
  if (span.textContent !== VO[i][1]) span.textContent = VO[i][1];
  span.style.opacity = clamp(prog(t, a - 0.1, 0.25)) * (1 - prog(t, until - 0.25, 0.25));
}

// ==== 1. Sarah's life: kitchen → bus → a customer call (0 to 16.5 s) ========================
// Three panels on one strip; the camera pans along it.
const LIFE = (() => {
  const layer = $('life');
  const strip = el(layer, '', '', 'width:5760px;height:1080px;transform-origin:0 0');
  // Kitchen at sunrise
  const k = el(strip, '', `
    <div class="abs" style="width:1920px;height:1080px;background:linear-gradient(180deg,#ffe2c4 0%,#fff3e3 55%,#f3e2cc 100%)"></div>
    <div class="abs" style="left:1160px;top:150px;width:520px;height:440px;border-radius:24px;background:linear-gradient(180deg,#ffb37a,#ffd9a8 60%,#fff0d6);border:18px solid #fff;box-shadow:inset 0 0 0 2px #f0d9bf"></div>
    <div class="abs sun" style="left:1340px;top:330px;width:150px;height:150px;border-radius:50%;background:#ffef9f;box-shadow:0 0 80px #ffd166"></div>
    <div class="abs" style="left:1178px;top:470px;width:484px;height:102px;background:linear-gradient(180deg,#e8a77a,#d78c63)"></div>
    <div class="abs" style="left:1410px;top:150px;width:18px;height:440px;background:#fff"></div>
    <div class="abs" style="left:0;top:760px;width:1920px;height:320px;background:#e9d3b8"></div>
    <div class="abs" style="left:0;top:740px;width:1920px;height:30px;background:#d9bf9f"></div>
    <div class="abs" style="left:240px;top:250px;width:300px;height:16px;border-radius:8px;background:#c79c74"></div>
    <div class="abs" style="left:262px;top:180px;width:60px;height:70px;border-radius:10px 10px 4px 4px;background:#2f6f73"></div>
    <div class="abs" style="left:338px;top:200px;width:46px;height:50px;border-radius:50%;background:#7fb069"></div>
    <div class="abs" style="left:402px;top:196px;width:90px;height:54px;border-radius:8px;background:#f05a1e;opacity:.85"></div>`, 'width:1920px;height:1080px');
  // The bus, with a city sliding past
  const b = el(strip, '', `<div class="abs" style="width:1920px;height:1080px;background:#dfe7ee"></div><div class="abs city" style="width:5000px;height:1080px"></div>
    <div class="abs" style="width:1920px;height:1080px;background:linear-gradient(90deg,#5d6b78 0 60px,transparent 60px 1860px,#5d6b78 1860px),linear-gradient(180deg,#5d6b78 0 90px,transparent 90px 760px,#5d6b78 760px)"></div>
    <div class="abs" style="left:0;top:760px;width:1920px;height:320px;background:#4b5763"></div>
    <div class="abs" style="left:600px;top:560px;width:560px;height:520px;border-radius:40px 40px 0 0;background:#2a3e6b"></div>
    <div class="abs" style="left:880px;top:90px;width:16px;height:670px;background:#c9ced4"></div>`, 'left:1920px;width:1920px;height:1080px');
  const city = b.querySelector('.city');
  const blocks = [];
  for (let i = 0; i < 40; i++) {
    const w = 120 + ((i * 53) % 140), h = 220 + ((i * 97) % 360), x = i * 130;
    blocks.push(`<div class="abs" style="left:${x}px;top:${760 - h}px;width:${w}px;height:${h}px;background:${['#9fb3c8', '#b8c7d6', '#8aa1b8', '#c7d2dd'][i % 4]};border-radius:6px 6px 0 0"></div>`);
  }
  city.innerHTML = blocks.join('');
  // The office: a customer call
  const o = el(strip, '', `<div class="abs" style="width:1920px;height:1080px;background:linear-gradient(180deg,#eef2f1,#e3ebe8)"></div>
    <div class="abs" style="left:120px;top:140px;width:420px;height:300px;border-radius:18px;background:#dbe8e3"></div>
    <div class="abs" style="left:150px;top:170px;width:360px;height:30px;border-radius:8px;background:#c8dbd4"></div>
    <div class="abs" style="left:150px;top:220px;width:240px;height:30px;border-radius:8px;background:#c8dbd4"></div>
    <div class="abs" style="left:0;top:780px;width:1920px;height:300px;background:#cfd9d5"></div>
    <div class="abs" style="left:1420px;top:520px;width:120px;height:160px;border-radius:12px 12px 30px 30px;background:#7fb069"></div>
    <div class="abs" style="left:1440px;top:660px;width:80px;height:120px;border-radius:0 0 14px 14px;background:#d97d54"></div>`, 'left:3840px;width:1920px;height:1080px');
  const sKitchen = makeSarah(k, 'front'), sBus = makeSarah(b, 'profile'), sCall = makeSarah(o, 'front');
  const lower = el(layer, 'lower', '<b>Sarah</b><span>Customer Success Associate</span>');
  const bubble = el(o, 'bubble', '“Thanks Sarah, you saved our launch!” 🙌');
  const heart = el(o, '', '<svg width="60" height="60" viewBox="0 0 24 24"><path fill="#f05a1e" d="M12 21s-7-4.4-9.5-8.6C.8 9.5 2.4 6 5.6 6c2 0 3.3 1.1 4.1 2.3h.6C11.1 7.1 12.4 6 14.4 6c3.2 0 4.8 3.5 3.1 6.4C19 16.6 12 21 12 21z"/></svg>');
  cue(2.1, 'sip', 0.5); cue(5.1, 'whoosh', 0.5); cue(10.2, 'whoosh', 0.5); cue(12.9, 'pop', 0.7); cue(13.4, 'tick', 0.5);
  return function render(t0) {
    // 74.2 to 77.6 s: back on a call, the part of the job she loves (the office panel again).
    const callback = t0 >= 74.2 && t0 < 77.6;
    const on = t0 < 17.2 || callback;
    show(layer, on);
    if (!on) return;
    const t = callback ? 11.4 + (t0 - 74.2) : t0;
    // Camera: hold on each panel, glide to the next.
    const pan = callback ? 2 : easeInOut(prog(t, 5.0, 0.9)) + easeInOut(prog(t, 10.1, 0.9));
    const drift = 1.03 - 0.03 * ((t % 5.1) / 5.1);
    strip.style.transform = `translate(${-pan * 1920}px, 0) scale(1)`;
    strip.style.filter = callback ? 'none' : `blur(${Math.sin(Math.PI * prog(t, 5.0, 0.9)) * 3 + Math.sin(Math.PI * prog(t, 10.1, 0.9)) * 3}px)`;
    // Kitchen: sunrise, coffee, a smile.
    k.querySelector('.sun').style.transform = `translateY(${-prog(t, 0, 5) * 90}px)`;
    const sip = Math.sin(Math.PI * prog(t, 2.0, 1.4));
    sKitchen.set({ x: 560, y: 380 + (1 - drift) * 200, s: 1.35, mood: 'happy', sip, blink: blinkAt(t, 1.2) + blinkAt(t, 4.0), head: Math.sin(t * 0.8) * 1.5, steam: 1 - sip });
    const lIn = spring(prog(t, 1.0, 0.6));

      put(tick, { x: 1480, y: 316, r: -8, s: lerp(1.5, 1, st), o: clamp(st * 2) * (1 - prog(p, 0.97, 0.03)) });
      rowEls.forEach((cells, k) => cells.forEach(e => { e.style.color = k < r || (k === r && p > 0.85) ? '#9a9ea7' : ''; }));
    } else { hl.style.visibility = 'hidden'; put(chip, { o: 0 }); put(tick, { o: 0 }); f.inputs.forEach((_, i) => setInput(f, i, '')); }
    const x47 = spring(prog(t, 27.5, 0.6));
    put(times, { x: 935, y: 590, s: lerp(1.4, 1, x47), o: clamp(x47 * 2) });
  };
})();

// The story was first timed without the explainer: the scenes still think in that "original"
// time. The film's time maps onto it: +6 s from 23 s (the explainer), and the Mubit part
// stretched by 3 s so its narration has room.
const STRETCH = (92.0 - 83.6) / (83.0 - 77.6);
function original(t) {
  if (t < 23) return t;
  if (t < 29) return 22.99;
  if (t < 83.6) return t - 6;
  if (t < 92.0) return 77.6 + (t - 83.6) / STRETCH;
  return t - 9;
}
function filmTime(o) {
  if (o < 23) return o;
  if (o < 77.6) return o + 6;
  if (o < 83.0) return 83.6 + (o - 77.6) * STRETCH;
  return o + 9;
}

// ==== Frame =================================================================================
window.DURATION = 105;
// Scene cues were written in the original time; the explainer's own cues are already in film time.
window.CUES = CUES.map(c => (c.film ? c : { ...c, t: +filmTime(c.t).toFixed(3) })).sort((a, b) => a.t - b.t);
window.KEY_TIMES = [1.6, 7.5, 13.8, 19.5, 24.6, 26.4, 28.0, 32.0, 37.0, 42.5, 46.4, 51.2, 54.8, 57.6, 63.0, 65.0, 67.3, 70.0, 74.4, 78.8, 81.6, 86.0, 90.0, 95.8, 101.0];
window.render = function render(t) {
  const o = original(t);
  $('fade').style.opacity = 0;
  LIFE(o);
  const phase = WORLD(o);
  if (phase) SCREEN(o, { phase });
  MUBIT(o);
  END(o);
  EXPLAIN(t);
  subtitles(t);
};
window.render(0);
</script>
