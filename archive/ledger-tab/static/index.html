<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger Tab</title>
<style>
  :root {
    --ink: #1c2230; --muted: #6b7385; --ghost: #9aa2b4; --line: #e5e8ee; --bg: #f6f7f9; --card: #fff;
    --accent: #2f6fed; --active: #eef3ff; --small: #0b7a52; --small-bg: #e2f4eb; --big: #5b6270; --big-bg: #eceef2;
    --fix: #b4500c; --fix-bg: #fdf0e6; --ok: #0b7a52; --low: #a16207;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  header { display: flex; align-items: center; flex-wrap: wrap; gap: 16px 24px; padding: 14px 24px; background: var(--card); border-bottom: 1px solid var(--line); }
  h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
  h1 small { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 6px; }
  label.client { color: var(--muted); font-size: 13px; }
  label.client select { margin-left: 6px; font: inherit; color: var(--ink); padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); }
  .stats { display: flex; gap: 22px; margin-left: auto; }
  .stat b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
  main { padding: 14px 24px 40px; }
  .bar { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; color: var(--muted); font-size: 13px; }
  .bar button { margin-left: auto; }
  kbd { font: 11px ui-monospace, Menlo, monospace; padding: 1px 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; background: var(--card); color: var(--ink); }
  button { font: inherit; font-size: 13px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  table { width: 100%; border-collapse: collapse; background: var(--card); }
  th { text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); background: #fafbfc; }
  td { padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  tr.active td { background: var(--active); }
  tr.active td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.desc { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
  td.in { color: var(--ok); }
  .wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
  select.pick { font: inherit; color: var(--ink); border: 1px solid transparent; border-radius: 5px; background: transparent; padding: 3px 2px; width: 220px; }
  select.pick.tax { width: 165px; }
  tr.idle select.pick { color: var(--ghost); }
  select.pick:hover, select.pick:focus { border-color: var(--line); background: var(--card); }
  tr.suggested select.pick { color: var(--ghost); font-style: italic; }
  tr.suggested.low select.pick { color: #c4a26a; }
  tr.edited select.pick { color: var(--fix); }
  tr.loading select.pick { color: var(--ghost); }
  .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 10px; }
  .badge.small { color: var(--small); background: var(--small-bg); }
  .badge.big { color: var(--big); background: var(--big-bg); }
  .badge.err { color: var(--fix); background: var(--fix-bg); }
  .meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .trace { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--muted); }
  .done { font-size: 12px; font-weight: 600; }
  .done.accepted { color: var(--ok); }
  .done.fixed { color: var(--fix); }
  .sure { font-size: 11px; color: var(--muted); }
  .sure.low { color: var(--low); }
</style>
</head>
<body>
<header>
  <h1>Ledger Tab <small>bank lines, coded by Tab</small></h1>
  <label class="client">Client <select id="client"></select></label>
  <div class="stats" id="stats"></div>
</header>
<main>
  <div class="bar">
    <span><kbd>Tab</kbd> accept and next</span>
    <span><kbd>Shift</kbd>+<kbd>Tab</kbd> back</span>
    <span>change a dropdown to fix, then <kbd>Tab</kbd> or Save fix</span>
    <button id="batch" type="button">Suggest next 10</button>
  </div>
  <div class="wrap"><table>
    <thead>
      <tr>
        <th>Date</th><th>Description</th><th class="num">Amount</th><th>Account</th><th>Tax</th>
        <th>Sure</th><th>Model</th><th class="num">ms</th><th>Trace</th><th></th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table></div>
</main>
<script>
const PREFETCH = 3;
const S = { meta: null, rows: [], active: 0 };
const $ = (id) => document.getElementById(id);

async function api(path, body) {
  const res = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
  return res.json();
}

function showStats(s) {
  const items = [["Calls", s.calls], ["Small model", s.small_pct + "%"], ["Avg latency", s.avg_ms + " ms"],
                 ["Accepts", s.accepts], ["Fixes", s.fixes], ["Accept rate", s.accept_rate + "%"]];
  $("stats").innerHTML = items.map(([k, v]) => `<div class="stat"><b>${v}</b><span>${k}</span></div>`).join("");
}

function options(list, placeholder) {
  return `<option value="">${placeholder}</option>` + list.map((o) => `<option value="${o.code}">${o.code} · ${o.name}</option>`).join("");
}

function renderRow(row) {
  const tr = row.el, s = row.sug;
  tr.className = [row.state, row.index === S.active ? "active" : "", s && s.sure === "low" ? "low" : ""].join(" ");
  const [acct, tax] = tr.querySelectorAll("select.pick");
  const busy = row.state === "loading";
  acct.options[0].text = busy ? "asking…" : "account";
  tax.options[0].text = busy ? "…" : "tax";
  if (row.state === "suggested") { acct.value = s.account || ""; tax.value = s.tax || ""; }
  const cell = (cls) => tr.querySelector("." + cls);
  if (s && s.error) {
    cell("sure").innerHTML = "";
    cell("model").innerHTML = `<span class="badge err" title="${s.error.replace(/"/g, "&quot;")}">error</span>`;
    cell("ms").textContent = ""; cell("trace").textContent = "";
  } else if (s) {
    cell("sure").innerHTML = `<span class="sure ${s.sure}">${s.sure}</span>`;
    cell("model").innerHTML = s.small ? `<span class="badge small" title="${s.served_by}">small model</span>`
                                      : `<span class="badge big" title="${s.served_by || "provider"}">big model</span>`;
    cell("ms").textContent = s.latency_ms;
    cell("trace").textContent = s.trace_id ? "…" + s.trace_id.slice(-6) : "";
    cell("trace").title = s.trace_id || "";
  }
  const act = cell("act");
  if (row.state === "accepted" || row.state === "fixed") act.innerHTML = `<span class="done ${row.state}">${row.state === "accepted" ? "✓ accepted" : "✎ fixed"}</span>`;
  else if (row.state === "edited") act.innerHTML = `<button type="button" data-do="save">Save fix</button>`;
  else if (row.state === "suggested") act.innerHTML = `<button type="button" data-do="save">Accept ⇥</button>`;
  else act.innerHTML = "";
}

function buildTable() {
  const accts = options(S.meta.accounts, "account"), taxes = options(S.meta.tax_codes, "tax");
  const body = $("rows");
  body.innerHTML = "";
  S.rows.forEach((row, i) => {
    row.index = i;
    row.sug = row.suggestion;
    row.state = row.decided ? row.decided.outcome : row.sug ? (row.sug.error ? "error" : "suggested") : "idle";
    const amt = Number(row.amount);
    const tr = document.createElement("tr");
    tr.innerHTML = `<td class="meta">${row.date}</td><td class="desc">${row.description}</td>
      <td class="num ${amt > 0 ? "in" : ""}">${amt.toLocaleString("en-GB", { minimumFractionDigits: 2 })}</td>
      <td><select class="pick">${accts}</select></td><td><select class="pick tax">${taxes}</select></td>
      <td class="sure"></td><td class="model"></td><td class="num meta ms"></td><td class="trace"></td><td class="act"></td>`;
    tr.addEventListener("click", (e) => {
      if (e.target.dataset.do === "save") return confirmRow(i);
      if (S.active !== i) setActive(i);
    });
    tr.querySelectorAll("select.pick").forEach((sel) => sel.addEventListener("change", () => {
      if (row.sug && !row.sug.error) { row.state = "edited"; renderRow(row); }
    }));
    row.el = tr;
    if (row.decided) { tr.querySelectorAll("select.pick")[0].value = row.decided.account; tr.querySelectorAll("select.pick")[1].value = row.decided.tax; }
    body.appendChild(tr);
    renderRow(row);
  });
}

function setActive(i) {
  if (!S.rows.length) return;
  const prev = S.rows[S.active];
  S.active = Math.max(0, Math.min(i, S.rows.length - 1));
  if (prev) renderRow(prev);
  const row = S.rows[S.active];
  renderRow(row);
  row.el.scrollIntoView({ block: "nearest" });
  ensure(S.active, PREFETCH);
}

function ensure(from, n, fresh = false) {
  const ids = S.rows.slice(from, from + n).filter((r) => r.state === "idle").map((r) => r.id);
  if (ids.length) fetchSuggestions(ids, fresh);
}

async function fetchSuggestions(ids, fresh) {
  const byId = Object.fromEntries(S.rows.map((r) => [r.id, r]));
  ids.forEach((id) => { byId[id].state = "loading"; renderRow(byId[id]); });
  try {
    const res = await api("/api/suggest", { line_ids: ids, fresh });
    res.suggestions.forEach((s) => {
      const row = byId[s.line_id];
      if (!row) return;
      row.sug = s; row.state = s.error ? "error" : "suggested";
      renderRow(row);
    });
    showStats(res.stats);
  } catch (err) {
    ids.forEach((id) => { byId[id].sug = { error: err.message }; byId[id].state = "error"; renderRow(byId[id]); });
  }
}

async function confirmRow(i) {
  const row = S.rows[i];
  if (!row || row.state === "idle" || row.state === "loading") return;
  if (!["suggested", "edited"].includes(row.state)) return setActive(i + 1);
  const [acct, tax] = row.el.querySelectorAll("select.pick");
  if (!acct.value || !tax.value) { acct.focus(); return; }
  document.activeElement.blur();
  const res = await api("/api/feedback", { line_id: row.id, account: acct.value, tax: tax.value });
  row.state = res.outcome;
  renderRow(row);
  showStats(res.stats);
  const byId = Object.fromEntries(S.rows.map((r) => [r.id, r]));
  res.refresh.forEach((id) => { const r = byId[id]; if (r) { r.state = "idle"; r.sug = null; renderRow(r); } });
  setActive(i + 1);
}

document.addEventListener("keydown", (e) => {
  if (e.target.id === "client") return;
  if (e.key === "Tab") {
    e.preventDefault();
    if (e.shiftKey) setActive(S.active - 1); else confirmRow(S.active);
  } else if (e.key === "Enter" && e.target.tagName !== "BUTTON") {
    e.preventDefault(); confirmRow(S.active);
  } else if (e.target.tagName !== "SELECT" && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
    e.preventDefault(); setActive(S.active + (e.key === "ArrowDown" ? 1 : -1));
  }
});

async function loadClient() {
  const { lines } = await api(`/api/lines?client_id=${encodeURIComponent($("client").value)}`);
  S.rows = lines; S.active = 0;
  buildTable();
  setActive(Math.max(0, S.rows.findIndex((r) => !r.decided)));
}

async function init() {
  S.meta = await api("/api/meta");
  $("client").innerHTML = S.meta.clients.map((c) => `<option value="${c.id}">${c.name}</option>`).join("");
  $("client").addEventListener("change", loadClient);
  $("batch").addEventListener("click", () => ensure(S.active, 10));
  showStats(await api("/api/stats"));
  await loadClient();
}
init();
</script>
</body>
</html>
